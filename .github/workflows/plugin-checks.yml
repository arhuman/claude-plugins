name: plugin-checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned, not the runner's preinstalled copy: a lint gate that moves
      # with the image changes its verdict without a commit to blame.
      - name: Install shellcheck
        run: |
          curl -sSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar -xJ
          sudo mv shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      # The pinned spproof, tiktoken and pyyaml, the same pins a local
      # `make tools` installs. Before `make check` so the token-budget and
      # frontmatter checks take their real path: both degrade to a weaker
      # check (or skip) when their import is missing, which would pass
      # silently here. A named step keeps a download failure separate from a
      # check failure.
      - name: Install pinned tools
        run: make tools
      - name: Static checks
        run: make check
      # Pinned for the same reason as shellcheck: an unpinned CLI changes the
      # validator's verdict without a commit to blame. Bump it on purpose,
      # after `make validate` passes locally with the new version.
      - name: Validate plugin manifests (strict)
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.286
          make validate
