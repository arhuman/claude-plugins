schema_version: "1.0"
name: docs-readme-section
description: 'documentation-rules vs senior-voice: README structure'
tags: [trigger]
execution:
  prompt: |
    Add an Installation section to our README.md and fix its Markdown heading levels so the document has a single H1.
  max_turns: 3
  timeout_seconds: 120
  allowed_tools: [Skill]
runs: 3
graders:
  - type: tool_used
    name: fires-documentation-rules
    tool: Skill
    input_match: '"10x:documentation-rules"'
    weight: 2
  - type: tool_used
    name: not-senior-voice
    tool: Skill
    input_match: '"10x:senior-voice"'
    min: 0
    max: 0
    arm: both
