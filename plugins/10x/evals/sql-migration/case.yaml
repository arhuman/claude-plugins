schema_version: "1.0"
name: sql-migration
description: 'lang-sql vs lang-go: a PostgreSQL migration'
tags: [trigger]
execution:
  prompt: |
    Write a PostgreSQL migration adding an index on orders(customer_id) without locking writes on a large table, with its down migration.
  max_turns: 3
  timeout_seconds: 120
  allowed_tools: [Skill]
runs: 3
graders:
  - type: tool_used
    name: fires-lang-sql
    tool: Skill
    input_match: '"10x:lang-sql"'
  - type: tool_used
    name: not-lang-go
    tool: Skill
    input_match: '"10x:lang-go"'
    min: 0
    max: 0
    arm: both
