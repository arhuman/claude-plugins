schema_version: "1.0"
name: commit-jj-split
description: 'commit vs senior-voice: a jj commit with a split'
tags: [trigger]
execution:
  prompt: |
    Commit my working copy with jj. The refactor and the bug fix are mixed in it, so split them into two commits with proper messages.
  max_turns: 3
  timeout_seconds: 120
  allowed_tools: [Skill]
runs: 3
graders:
  - type: tool_used
    name: fires-commit
    tool: Skill
    input_match: '"10x:commit"'
    weight: 2
  - type: tool_used
    name: not-senior-voice
    tool: Skill
    input_match: '"10x:senior-voice"'
    min: 0
    max: 0
    arm: both
