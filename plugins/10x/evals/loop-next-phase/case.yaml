schema_version: "1.0"
name: loop-next-phase
description: '10x:loop vs built-in loop and steering: execute a plan phase'
tags: [trigger]
execution:
  prompt: |
    Execute the next todo phase of our plan in .claude/plan/, prove it with its acceptance command, commit it and stop.
  max_turns: 3
  timeout_seconds: 120
  allowed_tools: [Skill]
runs: 3
graders:
  - type: tool_used
    name: fires-10x-loop
    tool: Skill
    input_match: '"10x:loop"'
  - type: tool_used
    name: not-builtin-loop
    tool: Skill
    input_match: '"loop"'
    min: 0
    max: 0
    arm: both
  - type: tool_used
    name: not-steering
    tool: Skill
    input_match: '"10x:steering"'
    min: 0
    max: 0
    arm: both
