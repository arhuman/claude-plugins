schema_version: "1.0"
name: testing-local-bug-ambiguous
description: 'testing vs bug reproduction: ambiguous, a local bug with no plan'
tags: [trigger]
execution:
  prompt: |
    parseDuration("1h30m") returns 0 in my Go code instead of 90 minutes. Reproduce it with a failing test, then fix it.
  max_turns: 3
  timeout_seconds: 120
  allowed_tools: [Skill]
runs: 3
graders:
  - type: tool_used
    name: fires-testing-or-lang-go
    tool: Skill
    input_match: '"(10x:testing|10x:lang-go)"'
  - type: tool_used
    name: not-loop
    tool: Skill
    input_match: '"10x:loop"'
    min: 0
    max: 0
    arm: both
