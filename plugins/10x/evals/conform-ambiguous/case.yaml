schema_version: "1.0"
name: conform-ambiguous
description: 'conform vs quality review: ambiguous, is this repo in good shape; a direct answer passes, a wrong component fails'
tags: [trigger, heldout]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Is this repository in good shape? Check it and tell me what to fix first.
  max_turns: 3
  timeout_seconds: 120
  allowed_tools: [Skill]
runs: 3
graders:
  - type: tool_used
    name: no-wrong-component
    tool: Skill
    input_match: '"10x:(loop|steering|commit|testing|manual)"'
    min: 0
    max: 0
    arm: both
